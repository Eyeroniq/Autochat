# AutoChat with a hosted OpenAI-compatible LLM API + embeddings on local CPU.
#
#   cp .env.lite.example .env   # then fill it in
#   docker compose up -d --build            # http://localhost:8080/ui
#   docker compose --profile https up -d    # also serve https://$DOMAIN via Caddy
name: autochat

services:
  autochat:
    # Built from this repository, so the image has this code and UI.
    build:
      context: .
      args:
        EXTRAS: core
    image: autochat:local
    restart: unless-stopped
    env_file: .env
    environment:
      AUTOCHAT_PROFILES: lite
      AUTOCHAT_PROJECT_ROOT: /home/worker/app
      AUTOCHAT_SETTINGS_FOLDER: /home/worker/app
      OPENAI_EMBEDDING_API_BASE: http://ollama:11434/v1
      OPENAI_EMBEDDING_API_KEY: ollama
    volumes:
      - ./settings-lite.yaml:/home/worker/app/settings-lite.yaml:ro
      - autochat-data:/home/worker/app/local_data
    ports:
      # Localhost only by default; set AUTOCHAT_BIND=0.0.0.0 to expose without Caddy.
      # AUTOCHAT_PORT changes the host port when 8080 is taken.
      - "${AUTOCHAT_BIND:-127.0.0.1}:${AUTOCHAT_PORT:-8080}:8080"
    depends_on:
      ollama-pull:
        condition: service_completed_successfully

  # Embeddings only; the chat model runs at OPENAI_API_BASE.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_PARALLEL: 2
      OLLAMA_KEEP_ALIVE: 24h
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: downloads the embedding model before AutoChat starts.
  ollama-pull:
    image: ollama/ollama:latest
    entrypoint: ["ollama", "pull", "${EMBEDDING_MODEL:-nomic-embed-text}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # Automatic HTTPS for a public domain. DOMAIN must point at this server.
  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    command: caddy reverse-proxy --from ${DOMAIN:-localhost} --to autochat:8080
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
    depends_on:
      - autochat

volumes:
  autochat-data:
  ollama-models:
  caddy-data:
